<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>猫咪捕猎游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: #f5f0e8;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }

        #gameCanvas {
            background: #f5f0e8;
            cursor: crosshair;
            display: block;
        }

        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
            display: none;
        }

        .score-board {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
        }

        .timer {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
        }

        #startScreen, #gameOverScreen, #animationScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(245, 240, 232, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #gameOverScreen, #animationScreen {
            display: none;
        }

        h1 {
            font-size: 42px;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        h2 {
            font-size: 32px;
            color: #333;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
            text-align: center;
            max-width: 400px;
            line-height: 1.5;
        }

        .btn {
            background: #333;
            color: white;
            border: 3px solid transparent;
            padding: 15px 40px;
            font-size: 22px;
            border-radius: 50px;
            cursor: pointer;
            pointer-events: all;
            transition: transform 0.2s, border-color 100ms ease;
            margin: 8px;
            min-width: 220px;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn.focused {
            border-color: #ff6b35 !important;
        }

        .btn-secondary {
            background: #666;
        }

        .btn-outline {
            background: transparent;
            color: #333;
            border: 2px solid #333;
        }

        .final-score {
            font-size: 36px;
            color: #333;
            margin: 20px 0;
        }

        .combo-display {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: #ff6b35;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .combo-display.show {
            opacity: 1;
        }

        .mode-switch {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 50;
            display: none;
        }

        .mode-switch button {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }

        .duration-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }

        .back-btn {
            margin-top: 20px;
            font-size: 16px;
            padding: 10px 30px;
        }

        .mode-description {
            font-size: 14px;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="score-board">得分: <span id="score">0</span></div>
        <div class="timer">时间: <span id="time">60</span>s</div>
    </div>

    <div class="combo-display" id="comboDisplay"></div>

    <div class="mode-switch" id="modeSwitch">
        <button data-action="switchMode">返回菜单</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="startScreen">
        <h1>🐱 猫咪游戏</h1>
        <p class="subtitle">选择模式开始</p>
        <button class="btn" data-action="startGameMode">
            🎮 游戏模式
            <div class="mode-description">点击捕捉，60秒挑战</div>
        </button>
        <button class="btn btn-outline" data-action="showAnimationSettings">
            📺 动画模式
            <div class="mode-description">无限循环，给猫看的动画</div>
        </button>
    </div>

    <div id="animationScreen">
        <h2>📺 动画模式</h2>
        <p class="subtitle">选择播放时长</p>
        <div class="duration-options">
            <button class="btn" data-action="startAnimationMode" data-param="30min">
                30 分钟
            </button>
            <button class="btn" data-action="startAnimationMode" data-param="1hour">
                1 小时
            </button>
            <button class="btn btn-secondary" data-action="startAnimationMode" data-param="infinite">
                无限循环
            </button>
        </div>
        <button class="btn btn-outline back-btn" data-action="showMenu">返回</button>
    </div>

    <div id="gameOverScreen">
        <h1>游戏结束！</h1>
        <div class="final-score">最终得分: <span id="finalScore">0</span></div>
        <p style="font-size: 18px; color: #666; margin-bottom: 20px;">最高连击: <span id="maxCombo">0</span></p>
        <button class="btn" data-action="restart">再玩一次</button>
        <button class="btn btn-outline" data-action="showMenu">返回菜单</button>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
